[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-remediation-workbench"
version = "1.0.0"
description = "Local-first CBOM analysis and evidence-backed cryptographic remediation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cryptoworkbench = "cryptoworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["cryptoworkbench*"]

[tool.setuptools.package-data]
cryptoworkbench = ["dashboard.html"]
